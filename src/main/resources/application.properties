spring.application.name=shopping.tracker

# --- Database connection ---
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Hibernate & JPA ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway (if you're using it) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Enable tracing
management.tracing.enabled=true

# Send traces to Zipkin (optional); Disabled Set the URL and set sampling rate to 1.0
management.zipkin.tracing.endpoint=
management.tracing.sampling.probability=0.0
management.endpoints.web.exposure.include=*
logging.pattern.level=%5p [trace=%X{traceId} span=%X{spanId}]
logging.level.com.nir.shopping.tracker.service=debug




